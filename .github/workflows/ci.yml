name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.15.22 mypy==2.3.0

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy app eval

      - name: Run tests
        run: pytest

      - name: Build vector store (ingest)
        run: python -m app.rag.ingest

      - name: Retrieval evaluation gate (hit-rate >= 0.8)
        # Retrieval-only: uses local embeddings, no LLM/API key required.
        run: python -m eval.run_eval
