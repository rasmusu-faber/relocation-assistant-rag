[project]
name = "relocation-assistant-rag"
version = "0.1.0"
description = "RAG assistant with source citations and an evaluation harness."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, flake8-bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
# Third-party libs (chromadb, sentence_transformers, streamlit) ship no type
# stubs; don't fail on their missing imports — we type-check our own code.
ignore_missing_imports = true
warn_unused_ignores = true
